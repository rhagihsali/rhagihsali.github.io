<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alaala Cabinet - Private</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8B4513">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5e6d3}
.login{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:white;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.2);width:100%;max-width:350px;text-align:center}
.login-box h1{color:#8B4513;margin-bottom:10px}
.login-box input{width:100%;padding:12px;margin:15px 0;border:2px solid #D2691E;border-radius:10px;font-size:16px;text-align:center}
.login-box button{width:100%;padding:12px;background:#8B4513;color:white;border:none;border-radius:10px;font-weight:bold;font-size:16px}
.main{display:none;padding:10px;padding-bottom:80px}
.header{background:linear-gradient(135deg,#8B4513,#D2691E);color:white;padding:20px;border-radius:15px;text-align:center;margin-bottom:15px}
.toc{background:white;padding:15px;border-radius:10px;margin-bottom:15px}
.toc h3{color:#8B4513;margin-bottom:10px}
.toc-list{list-style:none;max-height:220px;overflow-y:auto}
.toc-list li{padding:8px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;cursor:pointer;font-size:13px}
.toc-list li:hover{background:#f5e6d3}
.cabinet{background:#8B4513;padding:12px;border-radius:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:#f5e6d3;border-radius:8px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.slot.filled{background-size:cover;background-position:center}
.slot.num{position:absolute;top:3px;left:5px;background:#8B4513;color:white;font-size:9px;padding:2px 5px;border-radius:8px}
.install{background:#25D366;color:white;padding:10px;border-radius:10px;text-align:center;margin-bottom:10px}
.install button{background:white;color:#25D366;border:none;padding:6px 15px;border-radius:15px;font-weight:bold}
</style>
</head>
<body>
<div class="login" id="login">
<div class="login-box">
<h1>🗄️ Alaala Cabinet</h1>
<p>Private ng Pamilya - Culion</p>
<input type="password" id="pw" placeholder="Ilagay Password">
<button onclick="login()">Buksan ang Cabinet</button>
<p style="font-size:11px;margin-top:10px;color:#888">Default: pamilya123<br>Pwede palitan sa code</p>
</div>
</div>

<div class="main" id="main">
<div class="install">📱 Gawing APP! <button onclick="installApp()">I-INSTALL</button><br><span style="font-size:10px">Pindutin ⋮ > Add to Home Screen kung wala button</span></div>

<div class="header">
<h1>🗄️ ALAALA CABINET</h1>
<p>110 Alaala ng Pamilya - May Password</p>
</div>

<div class="toc">
<h3>📖 Table of Contents</h3>
<ul class="toc-list" id="toc"></ul>
</div>

<div class="cabinet"><div class="grid" id="grid"></div></div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
const PASSWORD="pamilya123"; // <-- PALITAN MO PASSWORD DITO BOSS
function login(){
  if(document.getElementById('pw').value===PASSWORD){
    document.getElementById('login').style.display='none';
    document.getElementById('main').style.display='block';
    localStorage.setItem('cabinet_login','yes');
  } else { alert('Mali password boss!'); }
}
if(localStorage.getItem('cabinet_login')==='yes'){
  document.getElementById('login').style.display='none';
  document.getElementById('main').style.display='block';
}
const grid=document.getElementById('grid');
const toc=document.getElementById('toc');
for(let i=1;i<=110;i++){
  let title="Alaala #"+i+" - Bakante pa";
  if(i==1) title="Bahay sa Culion";
  if(i==2) title="Si Lola at Lolo";
  if(i==3) title="Mama at Papa";
  const li=document.createElement('li');
  li.innerHTML=`<span>${i}. ${title}</span><span>${localStorage.getItem('cabinet_'+i)?'✅':'⭕'}</span>`;
  li.onclick=()=>document.getElementById('grid').children[i-1].click();
  toc.appendChild(li);
  const div=document.createElement('div');
  div.className='slot';
  div.innerHTML=`<span class="num">${i}</span><span style="font-size:22px">+</span>`;
  div.onclick=()=>openSlot(i,div);
  grid.appendChild(div);
}
let curDiv=null;
function openSlot(num,div){
  curDiv=div; curDiv.dataset.num=num;
  document.getElementById('fileInput').click();
}
document.getElementById('fileInput').onchange=function(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=function(ev){
    curDiv.style.backgroundImage=`url('${ev.target.result}')`;
    curDiv.classList.add('filled');
    curDiv.innerHTML=`<span class="num">${curDiv.dataset.num}</span>`;
    localStorage.setItem('cabinet_'+curDiv.dataset.num, ev.target.result);
    location.reload();
  }; r.readAsDataURL(file);
}
for(let i=1;i<=110;i++){
  const d=localStorage.getItem('cabinet_'+i);
  if(d){
    const div=grid.children[i-1];
    div.style.backgroundImage=`url('${d}')`;
    div.classList.add('filled');
    div.innerHTML=`<span class="num">${i}</span>`;
  }
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
function installApp(){
  if(deferredPrompt) deferredPrompt.prompt();
  else alert('Sa Chrome: Pindutin ⋮ > Add to Home Screen > Install');
}
</script>
</body>
</html>
